server:
  port: 8080

spring:
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: ${gateway.upstream.user}
              predicates:
                - Path=/api/v1/users/**,/api/v1/auth/**,/api/v1/admin/**
            # Đặt trước board-service vì Card API mang Project scope nhưng do task-service sở hữu.
            - id: task-service
              uri: ${gateway.upstream.task:http://localhost:8083}
              predicates:
                - Path=/api/v1/projects/*/boards/*/cards/**,/api/v1/projects/*/cards/**
            - id: board-service
              uri: ${gateway.upstream.board:http://localhost:8082}
              predicates:
                - Path=/api/v1/projects/**,/api/v1/boards/**,/api/v1/columns/**,/api/v1/invitations/**
            # Kênh sống của bảng do task-service bắn event card.moved / card.created.
            - id: task-service-ws
              uri: ${gateway.upstream.task-websocket:ws://localhost:8083}
              predicates:
                - Path=/ws/**
            - id: notification-service
              uri: ${gateway.upstream.notification:http://localhost:8084}
              predicates:
                - Path=/api/v1/notifications/**

app:
  jwt:
    issuer: ${USER_JWT_ISSUER:dev-platform-user-service}

gateway:
  upstream:
    user: ${GATEWAY_UPSTREAM_USER:http://localhost:8081}
    task-websocket: ${GATEWAY_UPSTREAM_TASK_WEBSOCKET:ws://localhost:8083}
  realtime:
    websocket:
      ticket-ttl: ${GATEWAY_WS_TICKET_TTL:PT30S}
      allowed-origins: ${GATEWAY_WS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
