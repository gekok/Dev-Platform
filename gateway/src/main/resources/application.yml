server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: ${gateway.upstream.user:http://localhost:8081}
              predicates:
                - Path=/api/v1/users/**,/api/v1/auth/**
            # Đặt trước board-service vì Card API mang Project scope nhưng do task-service sở hữu.
            - id: task-service
              uri: ${gateway.upstream.task:http://localhost:8083}
              predicates:
                - Path=/api/v1/projects/*/boards/*/cards/**,/api/v1/projects/*/cards/**
            - id: board-service
              uri: ${gateway.upstream.board:http://localhost:8082}
              predicates:
                - Path=/api/v1/projects/**,/api/v1/boards/**,/api/v1/columns/**,/api/v1/invitations/**
            # Kênh sống của bảng do task-service bắn event card.moved / card.created.
            - id: task-service-ws
              uri: ${gateway.upstream.task:http://localhost:8083}
              predicates:
                - Path=/ws/**
            - id: notification-service
              uri: ${gateway.upstream.notification:http://localhost:8084}
              predicates:
                - Path=/api/v1/notifications/**
