server:
  port: 8084

spring:
  config:
    import: optional:file:../../.env[.properties],optional:file:.env[.properties]
  application:
    name: notification-service
  datasource:
    url: '${NOTIFICATION_DB_URL:jdbc:sqlserver://localhost;instanceName=PHUC;databaseName=kanban_notification_db;encrypt=true;trustServerCertificate=true}'
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:none}
    properties:
      hibernate:
        show_sql: true
        auto_quote_keyword: true
        dialect: org.hibernate.dialect.SQLServerDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:devplatform}
    password: ${RABBITMQ_PASSWORD:devplatform}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

dev-platform:
  internal-notifications:
    enabled: ${INTERNAL_NOTIFICATIONS_ENABLED:false}
  messaging:
    enabled: ${MESSAGING_ENABLED:false}
    outbox-relay:
      enabled: ${OUTBOX_RELAY_ENABLED:false}
      fixed-delay-ms: ${OUTBOX_RELAY_FIXED_DELAY_MS:1000}
      retry-delay: ${OUTBOX_RELAY_RETRY_DELAY:PT5S}
      confirm-timeout: ${OUTBOX_RELAY_CONFIRM_TIMEOUT:PT5S}
    consumers:
      enabled: ${MESSAGING_CONSUMERS_ENABLED:false}
