server:
  port: 8083

spring:
  config:
    import: optional:file:../../.env[.properties],optional:file:.env[.properties]
  application:
    name: task-service
  datasource:
    url: '${TASK_DB_URL:jdbc:sqlserver://localhost;instanceName=PHUC;databaseName=kanban_task_db;encrypt=true;trustServerCertificate=true}'
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:none}
    properties:
      hibernate:
        show_sql: true
        auto_quote_keyword: true
        dialect: org.hibernate.dialect.SQLServerDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:devplatform}
    password: ${RABBITMQ_PASSWORD:devplatform}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

dev-platform:
  security:
    internal-service-token: ${INTERNAL_SERVICE_TOKEN:}
  internal:
    board-service:
      base-url: ${BOARD_SERVICE_BASE_URL:http://localhost:8082}
  messaging:
    enabled: ${MESSAGING_ENABLED:false}
    outbox-relay:
      enabled: ${OUTBOX_RELAY_ENABLED:false}
      fixed-delay-ms: ${OUTBOX_RELAY_FIXED_DELAY_MS:1000}
      retry-delay: ${OUTBOX_RELAY_RETRY_DELAY:PT5S}
      confirm-timeout: ${OUTBOX_RELAY_CONFIRM_TIMEOUT:PT5S}
    consumers:
      enabled: ${MESSAGING_CONSUMERS_ENABLED:false}
  assignment-cleanup:
    enabled: ${MEMBER_ASSIGNMENT_CLEANUP_ENABLED:false}
    fixed-delay-ms: ${MEMBER_ASSIGNMENT_CLEANUP_FIXED_DELAY_MS:1000}
