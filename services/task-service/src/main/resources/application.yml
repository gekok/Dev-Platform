server:
  port: 8083

spring:
  application:
    name: task-service
  datasource:
    url: jdbc:postgresql://localhost:5434/task_db
    driver-class-name: org.postgresql.Driver
    username: devplatform
    password: devplatform
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
