server:
  port: 8083

spring:
  config:
    import: optional:file:../../.env[.properties],optional:file:.env[.properties]
  application:
    name: task-service
  datasource:
    url: '${TASK_DB_URL:jdbc:sqlserver://localhost;instanceName=PHUC;databaseName=kanban_task_db;encrypt=true;trustServerCertificate=true}'
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:none}
    properties:
      hibernate:
        show_sql: true
        auto_quote_keyword: true
        dialect: org.hibernate.dialect.SQLServerDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:devplatform}
    password: ${RABBITMQ_PASSWORD:devplatform}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

dev-platform:
  security:
    trusted-gateway-identity:
      enabled: ${TASK_TRUSTED_GATEWAY_IDENTITY_ENABLED:false}
  realtime:
    board-lookup:
      ready: ${TASK_BOARD_PROJECT_LOOKUP_READY:false}
    gateway-proxy:
      ready: ${TASK_GATEWAY_WEBSOCKET_PROXY_READY:false}
    board-websocket:
      enabled: ${TASK_BOARD_WEBSOCKET_ENABLED:false}
      authorization-recheck-ms: ${TASK_BOARD_WEBSOCKET_AUTHORIZATION_RECHECK_MS:30000}
  messaging:
    enabled: ${MESSAGING_ENABLED:false}
    outbox-relay:
      enabled: ${OUTBOX_RELAY_ENABLED:false}
      fixed-delay-ms: ${OUTBOX_RELAY_FIXED_DELAY_MS:1000}
      retry-delay: ${OUTBOX_RELAY_RETRY_DELAY:PT5S}
      confirm-timeout: ${OUTBOX_RELAY_CONFIRM_TIMEOUT:PT5S}
    consumers:
      enabled: ${MESSAGING_CONSUMERS_ENABLED:false}
      member-assignment-cleanup:
        queue: ${MEMBER_ASSIGNMENT_CLEANUP_QUEUE:task-service.member-assignment-cleanup}
        retry-dlq-ready: ${MEMBER_ASSIGNMENT_CLEANUP_RETRY_DLQ_READY:false}
  assignment-cleanup:
    enabled: ${MEMBER_ASSIGNMENT_CLEANUP_ENABLED:false}
    fixed-delay-ms: ${MEMBER_ASSIGNMENT_CLEANUP_FIXED_DELAY_MS:1000}
