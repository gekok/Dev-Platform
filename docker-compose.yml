services:
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-devplatform}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-devplatform}
    ports:
      - "5672:5672"
      - "15672:15672"

  postgres-user:
    image: postgres:16
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: devplatform
      POSTGRES_PASSWORD: devplatform
    ports:
      - "5432:5432"
    volumes:
      - pg-user:/var/lib/postgresql/data

  postgres-board:
    image: postgres:16
    environment:
      POSTGRES_DB: board_db
      POSTGRES_USER: devplatform
      POSTGRES_PASSWORD: devplatform
    ports:
      - "5433:5432"
    volumes:
      - pg-board:/var/lib/postgresql/data

  postgres-task:
    image: postgres:16
    environment:
      POSTGRES_DB: task_db
      POSTGRES_USER: devplatform
      POSTGRES_PASSWORD: devplatform
    ports:
      - "5434:5432"
    volumes:
      - pg-task:/var/lib/postgresql/data

  postgres-notification:
    image: postgres:16
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: devplatform
      POSTGRES_PASSWORD: devplatform
    ports:
      - "5435:5432"
    volumes:
      - pg-notification:/var/lib/postgresql/data

volumes:
  pg-user:
  pg-board:
  pg-task:
  pg-notification:
